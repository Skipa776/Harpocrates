[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "harpocrates"
version = "0.4.3"
description = "Secrets scanner with a bundled ML model, plus a redacting read tool for AI coding agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Joshua Do", email = "joshalfonsodo@gmail.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "onnxruntime>=1.17.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.6.0",
    "mypy>=1.0.0",
    "build>=1.0.0",
]
mcp = [
    "mcp>=1.27,<2",
]
# Model training and export (scripts/train_v11.py, scripts/convert_to_onnx.py). Not needed to scan.
train = [
    "xgboost>=2.0.0,<4",
    "scikit-learn>=1.3.0",
    "onnxmltools>=1.12.0",
]

[project.scripts]
harpocrates = "Harpocrates.cli:main"
harpocrates-mcp = "Harpocrates.mcp.server:main"

[project.urls]
Homepage = "https://github.com/Skipa776/Harpocrates"
Repository = "https://github.com/Skipa776/Harpocrates"
Issues = "https://github.com/Skipa776/Harpocrates/issues"

[tool.ruff]
line-length = 100
target-version = "py310"
src = [".", "cli"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = [
    "E501",   # Line too long (handled by formatter)
    "N999",   # Invalid module name — capital 'Harpocrates' is intentional brand casing
]

[tool.ruff.lint.per-file-ignores]
# N803/N806: uppercase X_train/X_val follow sklearn/numpy ML convention
"cli/Harpocrates/training/train_model.py" = ["N803", "N806"]
"cli/Harpocrates/training/generators/generate_data.py" = ["N806"]
# scripts/ and bench/ are dev-only exploratory tools — ML naming conventions and late imports expected
"scripts/*.py" = ["N803", "N806", "N812", "E402", "F841"]
"bench/*.py" = ["N803", "N806", "E402", "F841"]
# Analysis notebooks: compact exploratory style (setup before imports, one-line statements).
"bench/*.ipynb" = ["E401", "E402", "E701", "E702", "E731", "E741", "F811", "I001", "N803", "N812", "N816"]  # each round re-imports so it runs on its own

[tool.pytest.ini_options]
testpaths = ["cli/tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "integration: marks tests as integration tests that require building the package",
]

[tool.setuptools.packages.find]
where = ["cli"]
include = ["Harpocrates*"]
exclude = ["tests*", "examples*", "scripts*", "comparison*"]

[tool.setuptools.package-data]
"Harpocrates.ml.models" = [
    "model.onnx",
    "model_config.json",
    "onnx_model_hashes.json",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
