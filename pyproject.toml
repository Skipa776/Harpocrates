[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "harpocrates"
version = "1.3.0"
description = "Secrets scanner with a bundled ML model, plus a redacting read tool for AI coding agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Joshua Do", email = "joshalfonsodo@gmail.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "onnxruntime>=1.17.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.6.0",
    "mypy>=1.0.0",
    "build>=1.0.0",
]
mcp = [
    "mcp>=1.27,<2",
]
# Runtime needs of `--explain` (TreeSHAP). Not needed to scan.
explain = [
    "xgboost>=2.0.0,<4",
]
# deprecated alias of explain, remove after two minor releases
train = [
    "xgboost>=2.0.0,<4",
]

[project.scripts]
harpocrates = "Harpocrates.cli:main"
harpocrates-mcp = "Harpocrates.mcp.server:main"

[project.urls]
Homepage = "https://github.com/Skipa776/Harpocrates"
Repository = "https://github.com/Skipa776/Harpocrates"
Issues = "https://github.com/Skipa776/Harpocrates/issues"

[tool.ruff]
line-length = 100
target-version = "py310"
src = [".", "cli"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = [
    "E501",   # Line too long (handled by formatter)
    "N999",   # Invalid module name — capital 'Harpocrates' is intentional brand casing
]

[tool.ruff.lint.per-file-ignores]
# bench/ is a dev-only exploratory tool — ML naming conventions and late imports expected
"bench/*.py" = ["N803", "N806", "E402", "F841"]

[tool.pytest.ini_options]
testpaths = ["cli/tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "integration: marks tests as integration tests that require building the package",
]

[tool.setuptools.packages.find]
where = ["cli"]
include = ["Harpocrates*"]
exclude = ["tests*", "scripts*"]

[tool.setuptools.package-data]
"Harpocrates.ml.models" = [
    "model.onnx",
    "model_config.json",
    "onnx_model_hashes.json",
    "xgboost_model.json",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.harpo.docstrings]
# Modules converted to the Description/Parameters/Output format (DOC-DOCSTRING-01). Grows one module per commit.
enforce = [
    "cli/Harpocrates/core/classification.py",
    "cli/Harpocrates/core/result.py",
    "cli/Harpocrates/core/scanner.py",
    "cli/Harpocrates/detectors/entropy_detector.py",
    "cli/Harpocrates/detectors/path_tokens.py",
    "cli/Harpocrates/ml/context.py",
    "cli/Harpocrates/ml/explain.py",
    "cli/Harpocrates/ml/features.py",
    "cli/Harpocrates/ml/onnx_verifier.py",
    "cli/Harpocrates/ml/tokens.py",
    "cli/Harpocrates/ml/verifier.py",
    "cli/Harpocrates/utils/file_utils.py",
    "cli/Harpocrates/utils/redaction.py",
]
