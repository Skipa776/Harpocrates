name: Docs demos

# DOC-DEMO-01: every README demo GIF is rendered from its tape in docs/tapes/. The job does not commit anything;
# it checks the length and size limits and uploads the GIFs as an artifact to compare against docs/assets/.
on:
  push:
    paths:
      - "docs/tapes/**"
      - "bench/canary_repo.py"
      - "scripts/check_demo_gifs.py"
      - ".github/workflows/docs-demos.yml"
  pull_request:
    paths:
      - "docs/tapes/**"
      - "bench/canary_repo.py"
      - "scripts/check_demo_gifs.py"
      - ".github/workflows/docs-demos.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"  # gitleaks_8.30.1_linux_x64.tar.gz

jobs:
  demos:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (with LFS for model artifacts)
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install the package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[mcp]"

      - name: Install gitleaks (pinned release, checksum verified)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"

      - name: Render docs/tapes/scan.tape
        uses: charmbracelet/vhs-action@v2.1.1
        with:
          path: docs/tapes/scan.tape
          version: v0.12.1

      - name: Render docs/tapes/safe-read.tape
        uses: charmbracelet/vhs-action@v2.1.1
        with:
          path: docs/tapes/safe-read.tape
          version: v0.12.1

      - name: Check each GIF is at most 20 s and 5 MB
        run: python scripts/check_demo_gifs.py docs/assets/demo-scan.gif docs/assets/demo-safe-read.gif

      - name: Upload the rendered GIFs
        uses: actions/upload-artifact@v7
        with:
          name: demo-gifs
          path: |
            docs/assets/demo-scan.gif
            docs/assets/demo-safe-read.gif
