name: CI

on:
  push:
    branches: [ "main", "feature/**", "feat/**" ]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --manifest-path rust_scanner/Cargo.toml --check

      - name: Run clippy
        run: cargo clippy --manifest-path rust_scanner/Cargo.toml --all-targets -- -D warnings

      - name: Run Rust tests
        run: cargo test --manifest-path rust_scanner/Cargo.toml

  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (with LFS for model artifacts)
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[mcp]"

      - name: Run ruff
        run: ruff check .

      - name: Run pytest (unit + smoke, no integration)
        run: pytest -q -m "not integration"

  integration:
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout (with LFS for model artifacts)
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build
          pip install -r requirements.txt
          pip install -e ".[mcp]"

      - name: Run integration tests
        run: pytest -q -m integration -v
