name: CI

on:
  push:
    branches: [ "main", "feature/**", "feat/**" ]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --manifest-path core/Cargo.toml --check

      - name: Run clippy
        run: cargo clippy --manifest-path core/Cargo.toml --all-targets -- -D warnings

      - name: Run Rust tests
        run: cargo test --manifest-path core/Cargo.toml

  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (with LFS for model artifacts)
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,train,mcp]"

      - name: Run ruff
        run: ruff check .

      - name: Run pytest (unit + smoke, no integration)
        run: pytest -q -m "not integration"

  # FR-CORE-01: build the Rust binary so engine=auto paths (CLI tests) and the
  # Rust/Python parity test run against it. Unit tests pinned to engine=python
  # are unaffected.
  python-on-rust:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (with LFS for model artifacts)
        uses: actions/checkout@v6
        with:
          lfs: true

      - uses: dtolnay/rust-toolchain@stable

      - name: Build Rust scanner
        run: cargo build --release --manifest-path core/Cargo.toml

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,train,mcp]"

      - name: Run pytest against the Rust core
        env:
          HARPOCRATES_REQUIRE_RUST: "1"
        run: pytest -q -m "not integration"

  integration:
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout (with LFS for model artifacts)
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build
          pip install -e ".[dev,train,mcp]"

      - name: Run integration tests
        run: pytest -q -m integration -v
