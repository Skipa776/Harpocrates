name: CI

on:
  push:
    branches: [ "main", "feature/**" ]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (with LFS for model artifacts)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[mcp]"

      - name: Run ruff
        run: ruff check .

      - name: Run pytest (unit + smoke, no integration)
        run: pytest -q -m "not integration"

  integration:
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout (with LFS for model artifacts)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build
          pip install -r requirements.txt
          pip install -e ".[mcp]"

      - name: Run integration tests
        run: pytest -q -m integration -v
