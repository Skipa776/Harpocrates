name: CI

on:
  push:
    branches: [ "main", "feature/**", "feat/**" ]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --manifest-path core/Cargo.toml --check

      - name: Run clippy
        run: cargo clippy --manifest-path core/Cargo.toml --all-targets -- -D warnings

      - name: Run Rust tests
        run: cargo test --manifest-path core/Cargo.toml

  lint-and-test:
    name: lint-and-test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # 3.10 is the oldest supported version, 3.14 the one with zstd in the standard library.
      matrix:
        python-version: ["3.10", "3.11", "3.14"]

    steps:
      - name: Checkout (with LFS for model artifacts)
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,explain,mcp]"

      - name: Run ruff
        if: matrix.python-version == '3.11'
        run: ruff check .

      - name: Check docstrings
        if: matrix.python-version == '3.11'
        run: python scripts/check_docstrings.py --enforce

      - name: Run pytest (unit + smoke, no integration)
        run: pytest -q -m "not integration" --cov --cov-report=term  # TEST-01: fails below fail_under in pyproject.toml

  # FR-CORE-01: build the Rust binary (the scanner engine) and install harpo_native (the
  # same rules in process, for the read tool, hook, gate and Python engine), so the
  # whole suite runs on the Rust rules and the parity tests compare both with Python.
  # lint-and-test above runs without either, on the Python rules.
  python-on-rust:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (with LFS for model artifacts)
        uses: actions/checkout@v6
        with:
          lfs: true

      - uses: dtolnay/rust-toolchain@stable

      - name: Build Rust scanner
        run: cargo build --release --manifest-path core/Cargo.toml

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,explain,mcp]"
          pip install ./core

      - name: Run pytest against the Rust core
        env:
          HARPOCRATES_REQUIRE_RUST: "1"
          HARPO_REQUIRE_NATIVE: "1"
        run: pytest -q -m "not integration" --cov --cov-report=term  # TEST-01: fails below fail_under in pyproject.toml

  # macOS is where most users run Harpo; it also runs the case-insensitive file system test that Linux skips.
  unit-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout (with LFS for model artifacts)
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -e ".[dev,explain,mcp]"

      - name: Run pytest (unit + smoke, no integration)
        run: pytest -q -m "not integration"  # no --cov: the coverage floor is checked on Linux

  integration:
    runs-on: ubuntu-latest
    needs: lint-and-test
    timeout-minutes: 40

    steps:
      - name: Checkout (with LFS for model artifacts)
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build
          pip install -e ".[dev,explain,mcp]"

      # The end-to-end tests drive both agent CLIs against the local mock provider with fake keys; without them they skip.
      - name: Install the agent CLIs
        run: npm install -g @anthropic-ai/claude-code@2.1.312 @openai/codex@0.163.0

      - name: Run integration tests
        run: pytest -q -m integration -v

      - name: Record agent sessions for the latency check
        run: python -m bench.canary_harness --mode agent --agent all --out-dir "$RUNNER_TEMP/latency"

      # Shared runners are noisy, so this reports and does not block yet.
      - name: NFR-01 latency check
        continue-on-error: true
        run: python -m bench.check_latency --recordings "$RUNNER_TEMP/latency/mock" --out "$RUNNER_TEMP/latency-record"

      # The record holds numbers only; the recordings hold fake canaries and are never uploaded.
      - name: Upload latency record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: latency-record
          path: ${{ runner.temp }}/latency-record

  plugin-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.302
      - name: Run harpocrates-prompt plugin tests
        run: claude plugin test plugins/harpocrates-prompt
