[package]
name = "harpocrates-rust-scanner"
version = "0.1.0"
edition = "2024"
description = "Native regex and entropy scanning engine for Harpocrates"
license = "MIT"

[lib]
name = "harpocrates_rust_scanner"
path = "src/lib.rs"

[[bin]]
name = "harpocrates-rust-scanner"
path = "src/main.rs"

[[bench]]
name = "scanner"
harness = false

[dependencies]
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
