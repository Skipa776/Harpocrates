[package]
name = "harpocrates-rust-scanner"
version = "0.1.0"
edition = "2024"
description = "Native regex and entropy scanning engine for Harpocrates"
license = "MIT"

[lib]
name = "harpocrates_rust_scanner"
path = "src/lib.rs"
# cdylib is the Python extension module (feature "python", built by maturin from core/pyproject.toml).
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "harpocrates-rust-scanner"
path = "src/main.rs"

[[bench]]
name = "scanner"
harness = false

[features]
python = ["dep:pyo3"]

[dependencies]
pyo3 = { version = "0.23", features = ["abi3-py310"], optional = true }
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
